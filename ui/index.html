<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Screener Robots</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <div class="logo">SCREENER<span>ROBOTS</span></div>
    <div id="selinfo" class="selinfo">
      <span id="sel-key" class="dim">инструмент не выбран</span>
      <span id="sel-price" class="price"></span>
      <span id="sel-bid" class="bid"></span>
      <span id="sel-ask" class="ask"></span>
    </div>
    <div id="status" class="status"><span class="dot"></span><span id="status-text">подключение…</span></div>
    <div id="stats" class="stats"></div>
  </header>

  <main>
    <section id="table-panel">
      <div class="panel-title table-head-row">
        <span class="tabs">
          <button class="tab active" data-tab="robots">Роботы</button>
          <button class="tab" data-tab="growth">Топ роста</button>
          <button class="tab" data-tab="trades">Сделки</button>
          <span id="rows-count" class="dim"></span>
        </span>
        <span class="table-head-controls">
          <button id="scan-filter" class="btn-filter" title="Только: топ роста + сделки 24ч + RVOL≥5">★ фильтр</button>
          <input id="filter" type="text" placeholder="фильтр по монете…" autocomplete="off" />
        </span>
      </div>
      <div class="table-wrap">
        <table id="screener">
          <thead id="table-head"></thead>
          <tbody id="screener-body"></tbody>
        </table>
      </div>
    </section>

    <section id="indicator-panel">
      <div class="panel-title">BID / ASK <span id="ind-symbol" class="ind-symbol"></span><span class="dim"> — колесо = время · Shift+колесо = высота · драг = история · 2×клик = LIVE</span></div>
      <canvas id="indicator"></canvas>
      <div id="robot-detail" class="robot-detail dim">Кликните по инструменту в таблице</div>
    </section>
  </main>

  <script src="indicator.js"></script>
  <script src="app.js"></script>
</body>
</html>
